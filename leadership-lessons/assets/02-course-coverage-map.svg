<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1510" viewBox="0 0 1000 1510" role="img" aria-labelledby="title desc">
  <title id="title">How the six course sessions cover Phases I to IV</title>
  <desc id="desc">A vertical course map showing Session 1 in Phase I, Session 2 in Phase II, Sessions 3 to 5 in Phase III, and Session 6 in Phase IV.</desc>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12"/></filter></defs>
  <rect width="1000" height="1510" fill="#f7f4ed"/>
  <text x="500" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#536575">The phases overlap; this map shows each session's</text><text x="500" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#536575">primary emphasis</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(80 90)"><rect width="840" height="260" rx="28" fill="#dceff0" stroke="#2a9d8f" stroke-width="4"/><text x="50" y="58" font-size="32" font-weight="700" fill="#2a776e">PHASE I · SOVEREIGN FOUNDATIONS</text><g filter="url(#shadow)"><rect x="50" y="88" width="740" height="125" rx="20" fill="white"/></g><text x="80" y="133" font-size="30" font-weight="700" fill="#2a9d8f">SESSION 1</text><text x="265" y="130" font-size="31" font-weight="700" fill="#17324d">Understanding How Your Story</text><text x="265" y="172" font-size="31" font-weight="700" fill="#17324d">Shapes Your Leadership</text></g>
    <g transform="translate(80 390)"><rect width="840" height="260" rx="28" fill="#e7f2e4" stroke="#5a9367" stroke-width="4"/><text x="50" y="58" font-size="32" font-weight="700" fill="#4b7b56">PHASE II · INNER-LIFE GROWTH</text><g filter="url(#shadow)"><rect x="50" y="88" width="740" height="125" rx="20" fill="white"/></g><text x="80" y="133" font-size="30" font-weight="700" fill="#5a9367">SESSION 2</text><text x="80" y="178" font-size="34" font-weight="700" fill="#17324d">Building Character Before Influence</text></g>
    <g transform="translate(80 690)"><rect width="840" height="500" rx="28" fill="#fff0d8" stroke="#e9a23b" stroke-width="4"/><text x="50" y="58" font-size="32" font-weight="700" fill="#a56c14">PHASE III · MINISTRY MATURING</text><g filter="url(#shadow)"><rect x="50" y="88" width="740" height="105" rx="20" fill="white"/><rect x="50" y="218" width="740" height="105" rx="20" fill="white"/><rect x="50" y="348" width="740" height="105" rx="20" fill="white"/></g><text x="80" y="130" font-size="28" font-weight="700" fill="#d58b1e">SESSION 3</text><text x="265" y="122" font-size="30" font-weight="700" fill="#17324d">Learning Faithfulness</text><text x="265" y="160" font-size="30" font-weight="700" fill="#17324d">Through Service</text><text x="80" y="260" font-size="28" font-weight="700" fill="#d58b1e">SESSION 4</text><text x="265" y="252" font-size="30" font-weight="700" fill="#17324d">Discovering and Developing</text><text x="265" y="290" font-size="30" font-weight="700" fill="#17324d">Your Gifts</text><text x="80" y="390" font-size="28" font-weight="700" fill="#d58b1e">SESSION 5</text><text x="265" y="382" font-size="30" font-weight="700" fill="#17324d">Leading Through Conflict</text><text x="265" y="420" font-size="30" font-weight="700" fill="#17324d">and Relationships</text></g>
    <g transform="translate(80 1230)"><rect width="840" height="240" rx="28" fill="#f8e3de" stroke="#d66b58" stroke-width="4"/><text x="50" y="58" font-size="32" font-weight="700" fill="#a84e3e">PHASE IV · LIFE MATURING</text><g filter="url(#shadow)"><rect x="50" y="88" width="740" height="105" rx="20" fill="white"/></g><text x="80" y="130" font-size="28" font-weight="700" fill="#d66b58">SESSION 6</text><text x="265" y="130" font-size="34" font-weight="700" fill="#17324d">Leading From Spiritual Depth</text></g>
  </g>
</svg>
