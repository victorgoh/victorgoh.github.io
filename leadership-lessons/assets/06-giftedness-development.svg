<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1390" viewBox="0 0 1000 1390" role="img" aria-labelledby="title desc">
  <title id="title">Eight-stage giftedness development pathway</title>
  <desc id="desc">Eight connected stages from ministry experience through gift discovery, repeated use, effectiveness, other gifts, gift-mix, gift-cluster and convergence.</desc>
  <defs><marker id="arrow" markerWidth="24" markerHeight="18" refX="21" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M3 3 L21 9 L3 15" fill="none" stroke="#d58b1e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></marker><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12"/></filter></defs>
  <rect width="1000" height="1390" fill="#f7f4ed"/>
  <text x="500" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#536575">Recognition grows through service, fruit and community confirmation</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(80 95)"><rect width="390" height="220" rx="24" fill="#dceff0" stroke="#2a9d8f" stroke-width="4"/><text x="35" y="53" font-size="28" font-weight="700" fill="#2a9d8f">STAGE 1</text><text x="35" y="105" font-size="34" font-weight="700" fill="#17324d">Ministry experience</text><text x="35" y="155" font-size="28" fill="#536575">Begin serving</text></g>
    <g transform="translate(530 95)"><rect width="390" height="220" rx="24" fill="#e7f2e4" stroke="#5a9367" stroke-width="4"/><text x="35" y="53" font-size="28" font-weight="700" fill="#5a9367">STAGE 2</text><text x="35" y="105" font-size="34" font-weight="700" fill="#17324d">Discover a gift</text><text x="35" y="155" font-size="28" fill="#536575">Notice recurring capacity</text></g>
    <g transform="translate(80 390)"><rect width="390" height="220" rx="24" fill="#fff0d8" stroke="#e9a23b" stroke-width="4"/><text x="35" y="53" font-size="28" font-weight="700" fill="#d58b1e">STAGE 3</text><text x="35" y="105" font-size="34" font-weight="700" fill="#17324d">Increase use</text><text x="35" y="155" font-size="28" fill="#536575">Practise repeatedly</text></g>
    <g transform="translate(530 390)"><rect width="390" height="220" rx="24" fill="#f8e3de" stroke="#d66b58" stroke-width="4"/><text x="35" y="53" font-size="28" font-weight="700" fill="#d66b58">STAGE 4</text><text x="35" y="105" font-size="34" font-weight="700" fill="#17324d">Grow effective</text><text x="35" y="155" font-size="28" fill="#536575">Observe spiritual fruit</text></g>
    <g transform="translate(80 685)"><rect width="390" height="220" rx="24" fill="#ece6f5" stroke="#8267a8" stroke-width="4"/><text x="35" y="53" font-size="28" font-weight="700" fill="#8267a8">STAGE 5</text><text x="35" y="105" font-size="32" font-weight="700" fill="#17324d">Discover other gifts</text><text x="35" y="155" font-size="28" fill="#536575">New roles reveal more</text></g>
    <g transform="translate(530 685)"><rect width="390" height="220" rx="24" fill="#e4eaf3" stroke="#4f6d9a" stroke-width="4"/><text x="35" y="53" font-size="28" font-weight="700" fill="#4f6d9a">STAGE 6</text><text x="35" y="105" font-size="34" font-weight="700" fill="#17324d">Identify gift-mix</text><text x="35" y="155" font-size="28" fill="#536575">See the recurring pattern</text></g>
    <g transform="translate(80 980)"><rect width="390" height="220" rx="24" fill="#e7f2e4" stroke="#5a9367" stroke-width="4"/><text x="35" y="53" font-size="28" font-weight="700" fill="#5a9367">STAGE 7</text><text x="35" y="105" font-size="31" font-weight="700" fill="#17324d">Develop gift-cluster</text><text x="35" y="155" font-size="28" fill="#536575">Gifts begin to harmonise</text></g>
    <g transform="translate(530 980)"><rect width="390" height="220" rx="24" fill="#17324d" stroke="#17324d" stroke-width="4"/><text x="35" y="53" font-size="28" font-weight="700" fill="#f2c269">STAGE 8</text><text x="35" y="105" font-size="34" font-weight="700" fill="white">Convergence</text><text x="35" y="155" font-size="28" fill="#dceff0">A later-life horizon</text></g>
  </g>
  <g fill="none" stroke="#d58b1e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"><line x1="480" y1="205" x2="510" y2="205"/><path d="M725 325 L725 345 Q725 360 705 360 L275 360 Q255 360 255 380"/><line x1="480" y1="500" x2="510" y2="500"/><path d="M725 620 L725 640 Q725 655 705 655 L275 655 Q255 655 255 675"/><line x1="480" y1="795" x2="510" y2="795"/><path d="M725 915 L725 935 Q725 950 705 950 L275 950 Q255 950 255 970"/><line x1="480" y1="1090" x2="510" y2="1090"/></g>
  <rect x="100" y="1260" width="800" height="82" rx="20" fill="#17324d"/><text x="500" y="1295" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="white">Focus on service, discovery, practice and confirmation—</text><text x="500" y="1328" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="white">not on rushing toward a label.</text>
</svg>
