<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1430" viewBox="0 0 1000 1430" role="img" aria-labelledby="title desc">
  <title id="title">Clinton's six phases of leadership development</title>
  <desc id="desc">A vertical lifetime pathway through Sovereign Foundations, Inner-Life Growth, Ministry Maturing, Life Maturing, Convergence, and Afterglow or Celebration.</desc>
  <defs>
    <marker id="arrow" markerWidth="24" markerHeight="18" refX="21" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M3 3 L21 9 L3 15" fill="none" stroke="#52697a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.13"/></filter>
  </defs>
  <rect width="1000" height="1430" fill="#f7f4ed"/>
  <text x="500" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#536575">A developmental map—not a rigid timetable</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(140 95)"><rect width="720" height="170" rx="24" fill="#dceff0" stroke="#2a9d8f" stroke-width="4"/><circle cx="75" cy="85" r="42" fill="#2a9d8f"/><text x="75" y="97" text-anchor="middle" font-size="36" font-weight="700" fill="white">1</text><text x="145" y="70" font-size="38" font-weight="700" fill="#17324d">Sovereign Foundations</text><text x="145" y="118" font-size="30" fill="#405463">Background, family and formative story</text></g>
    <g transform="translate(140 310)"><rect width="720" height="170" rx="24" fill="#e7f2e4" stroke="#5a9367" stroke-width="4"/><circle cx="75" cy="85" r="42" fill="#5a9367"/><text x="75" y="97" text-anchor="middle" font-size="36" font-weight="700" fill="white">2</text><text x="145" y="70" font-size="38" font-weight="700" fill="#17324d">Inner-Life Growth</text><text x="145" y="118" font-size="30" fill="#405463">Character, truth and obedience</text></g>
    <g transform="translate(140 525)"><rect width="720" height="170" rx="24" fill="#fff0d8" stroke="#e9a23b" stroke-width="4"/><circle cx="75" cy="85" r="42" fill="#d58b1e"/><text x="75" y="97" text-anchor="middle" font-size="36" font-weight="700" fill="white">3</text><text x="145" y="70" font-size="38" font-weight="700" fill="#17324d">Ministry Maturing</text><text x="145" y="118" font-size="30" fill="#405463">Tasks, gifts and relationships</text></g>
    <g transform="translate(140 740)"><rect width="720" height="170" rx="24" fill="#f8e3de" stroke="#d66b58" stroke-width="4"/><circle cx="75" cy="85" r="42" fill="#d66b58"/><text x="75" y="97" text-anchor="middle" font-size="36" font-weight="700" fill="white">4</text><text x="145" y="70" font-size="38" font-weight="700" fill="#17324d">Life Maturing</text><text x="145" y="118" font-size="30" fill="#405463">Being, wisdom and spiritual depth</text></g>
    <g transform="translate(140 955)"><rect width="720" height="170" rx="24" fill="#ece6f5" stroke="#8267a8" stroke-width="4"/><circle cx="75" cy="85" r="42" fill="#8267a8"/><text x="75" y="97" text-anchor="middle" font-size="36" font-weight="700" fill="white">5</text><text x="145" y="70" font-size="38" font-weight="700" fill="#17324d">Convergence</text><text x="145" y="118" font-size="30" fill="#405463">Calling, role and giftedness align</text></g>
    <g transform="translate(140 1170)"><rect width="720" height="190" rx="24" fill="#e4eaf3" stroke="#4f6d9a" stroke-width="4"/><circle cx="75" cy="95" r="42" fill="#4f6d9a"/><text x="75" y="107" text-anchor="middle" font-size="36" font-weight="700" fill="white">6</text><text x="145" y="72" font-size="38" font-weight="700" fill="#17324d">Afterglow or Celebration</text><text x="145" y="122" font-size="30" fill="#405463">Wisdom, legacy and broad influence</text></g>
  </g>
  <g fill="none" stroke="#52697a" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"><line x1="500" y1="272" x2="500" y2="296"/><line x1="500" y1="487" x2="500" y2="511"/><line x1="500" y1="702" x2="500" y2="726"/><line x1="500" y1="917" x2="500" y2="941"/><line x1="500" y1="1132" x2="500" y2="1156"/></g>
</svg>
