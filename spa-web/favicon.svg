<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Emerald Teal Background Gradient -->
    <linearGradient id="spaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Vine Stem Gold Gradient -->
    <linearGradient id="goldVine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Leaf Emerald Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Soft Glow Effect -->
    <filter id="vineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="spaDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#022c22" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#spaBgGrad)"/>
  
  <!-- Subtle Inner Ring -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#6ee7b7" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Soft Radiant Backdrop Circle -->
  <circle cx="256" cy="256" r="160" fill="#10b981" opacity="0.15" filter="url(#vineGlow)"/>

  <!-- Vine Heart Branches & Leaves -->
  <g filter="url(#spaDropShadow)">
    <!-- Left Vine Branch forming left heart arc -->
    <path d="M256 390 C 230 340, 140 290, 130 200 C 120 120, 210 110, 256 180" 
          fill="none" stroke="url(#goldVine)" stroke-width="12" stroke-linecap="round"/>

    <!-- Right Vine Branch forming right heart arc -->
    <path d="M256 390 C 282 340, 372 290, 382 200 C 392 120, 302 110, 256 180" 
          fill="none" stroke="url(#goldVine)" stroke-width="12" stroke-linecap="round"/>

    <!-- Central Growing Branch Stem -->
    <path d="M256 420 V 220" stroke="url(#goldVine)" stroke-width="10" stroke-linecap="round"/>

    <!-- Left Heart Leaf 1 -->
    <path d="M145 180 C 100 150, 110 90, 165 115 C 190 140, 170 180, 145 180 Z" fill="url(#leafGrad)"/>
    
    <!-- Right Heart Leaf 1 -->
    <path d="M367 180 C 412 150, 402 90, 347 115 C 322 140, 342 180, 367 180 Z" fill="url(#leafGrad)"/>

    <!-- Middle Left Sprout Leaf -->
    <path d="M256 300 C 210 270, 200 230, 256 250 Z" fill="url(#leafGrad)"/>

    <!-- Middle Right Sprout Leaf -->
    <path d="M256 300 C 302 270, 312 230, 256 250 Z" fill="url(#leafGrad)"/>

    <!-- Top Sprout Leaf -->
    <path d="M256 180 C 235 130, 277 130, 256 180 Z" fill="#fef08a"/>

    <!-- Subtle Golden Star/Cross of Rest at Top Center -->
    <g filter="url(#vineGlow)">
      <path d="M256 130 V 160 M241 145 H 271" stroke="#fef08a" stroke-width="5" stroke-linecap="round"/>
      <circle cx="256" cy="145" r="4" fill="#ffffff"/>
    </g>
  </g>
</svg>
