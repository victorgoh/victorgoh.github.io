<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1450" viewBox="0 0 1000 1450" role="img" aria-labelledby="title desc">
  <title id="title">Eight-stage leadership backlash cycle</title>
  <desc id="desc">Eight connected steps from discerning direction and agreement through complications and resistance to seeking God, gaining clarity and responding faithfully.</desc>
  <defs><marker id="arrow" markerWidth="24" markerHeight="18" refX="21" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M3 3 L21 9 L3 15" fill="none" stroke="#b95041" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></marker><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12"/></filter></defs>
  <rect width="1000" height="1450" fill="#f7f4ed"/>
  <text x="500" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#536575">A diagnostic pattern—not permission to dismiss criticism</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(80 95)"><rect width="390" height="190" rx="24" fill="#dceff0" stroke="#2a9d8f" stroke-width="4"/><text x="35" y="52" font-size="30" font-weight="700" fill="#2a9d8f">1</text><text x="35" y="108" font-size="34" font-weight="700" fill="#17324d">Direction discerned</text></g>
    <g transform="translate(530 95)"><rect width="390" height="190" rx="24" fill="#e7f2e4" stroke="#5a9367" stroke-width="4"/><text x="35" y="52" font-size="30" font-weight="700" fill="#5a9367">2</text><text x="35" y="108" font-size="34" font-weight="700" fill="#17324d">People agree</text></g>
    <g transform="translate(80 355)"><rect width="390" height="190" rx="24" fill="#fff0d8" stroke="#e9a23b" stroke-width="4"/><text x="35" y="52" font-size="30" font-weight="700" fill="#d58b1e">3</text><text x="35" y="108" font-size="34" font-weight="700" fill="#17324d">Plan implemented</text></g>
    <g transform="translate(530 355)"><rect width="390" height="190" rx="24" fill="#f8e3de" stroke="#d66b58" stroke-width="4"/><text x="35" y="52" font-size="30" font-weight="700" fill="#d66b58">4</text><text x="35" y="108" font-size="34" font-weight="700" fill="#17324d">Complications arise</text></g>
    <g transform="translate(80 615)"><rect width="390" height="190" rx="24" fill="#f4dbd5" stroke="#b95041" stroke-width="4"/><text x="35" y="52" font-size="30" font-weight="700" fill="#b95041">5</text><text x="35" y="108" font-size="34" font-weight="700" fill="#17324d">Blame or resistance</text></g>
    <g transform="translate(530 615)"><rect width="390" height="190" rx="24" fill="#ece6f5" stroke="#8267a8" stroke-width="4"/><text x="35" y="52" font-size="30" font-weight="700" fill="#8267a8">6</text><text x="35" y="108" font-size="32" font-weight="700" fill="#17324d">Seek God and counsel</text></g>
    <g transform="translate(80 875)"><rect width="390" height="190" rx="24" fill="#e4eaf3" stroke="#4f6d9a" stroke-width="4"/><text x="35" y="52" font-size="30" font-weight="700" fill="#4f6d9a">7</text><text x="35" y="108" font-size="34" font-weight="700" fill="#17324d">Gain clarity</text></g>
    <g transform="translate(530 875)"><rect width="390" height="190" rx="24" fill="#dceff0" stroke="#2a9d8f" stroke-width="4"/><text x="35" y="52" font-size="30" font-weight="700" fill="#2a9d8f">8</text><text x="35" y="108" font-size="34" font-weight="700" fill="#17324d">Respond faithfully</text></g>
  </g>
  <g fill="none" stroke="#b95041" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"><line x1="480" y1="190" x2="510" y2="190"/><path d="M725 295 L725 315 Q725 325 705 325 L275 325 Q255 325 255 345"/><line x1="480" y1="450" x2="510" y2="450"/><path d="M725 555 L725 575 Q725 585 705 585 L275 585 Q255 585 255 605"/><line x1="480" y1="710" x2="510" y2="710"/><path d="M725 815 L725 835 Q725 845 705 845 L275 845 Q255 845 255 865"/><line x1="480" y1="970" x2="510" y2="970"/></g>
  <rect x="90" y="1145" width="820" height="215" rx="28" fill="#17324d"/><text x="500" y="1195" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="white">Respond with courage and humility</text><text x="500" y="1243" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" fill="#dceff0">Listen · Examine · Pray · Seek counsel</text><text x="500" y="1286" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" fill="#dceff0">Repair harm · Act faithfully</text><text x="500" y="1335" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#f2c269">Authority never removes accountability.</text>
</svg>
