<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1330" viewBox="0 0 1000 1330" role="img" aria-labelledby="title desc">
  <title id="title">Ministry task continuum</title>
  <desc id="desc">A vertical continuum moving from assignments that primarily shape the leader toward assignments that primarily accomplish ministry through the leader.</desc>
  <defs><linearGradient id="gradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a9d8f"/><stop offset="0.5" stop-color="#e9a23b"/><stop offset="1" stop-color="#d66b58"/></linearGradient><marker id="arrow" markerWidth="24" markerHeight="18" refX="21" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M3 3 L21 9 L3 15" fill="none" stroke="#17324d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1000" height="1330" fill="#f7f4ed"/>
  <text x="500" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#2a776e">LEADER-SHAPING EMPHASIS</text>
  <text x="500" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#536575">Faithfulness, character, learning and readiness</text>
  <line x1="215" y1="150" x2="215" y2="1115" stroke="url(#gradient)" stroke-width="34" stroke-linecap="round"/>
  <line x1="215" y1="135" x2="215" y2="1135" stroke="#17324d" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(160 175)"><circle cx="55" cy="55" r="45" fill="#2a9d8f"/><text x="55" y="67" text-anchor="middle" font-size="34" font-weight="700" fill="white">A</text><text x="135" y="51" font-size="34" font-weight="700" fill="#17324d">Early practice</text><text x="135" y="91" font-size="28" fill="#536575">Learning through small assignments</text></g>
    <g transform="translate(160 345)"><circle cx="55" cy="55" r="45" fill="#55a880"/><text x="55" y="67" text-anchor="middle" font-size="34" font-weight="700" fill="white">B</text><text x="135" y="51" font-size="34" font-weight="700" fill="#17324d">Tested service</text><text x="135" y="91" font-size="28" fill="#536575">Faithfulness under real pressure</text></g>
    <g transform="translate(160 515)"><circle cx="55" cy="55" r="45" fill="#d3a340"/><text x="55" y="67" text-anchor="middle" font-size="34" font-weight="700" fill="white">C</text><text x="135" y="51" font-size="34" font-weight="700" fill="#17324d">Balanced task</text><text x="135" y="91" font-size="28" fill="#536575">Formation and ministry fruit together</text></g>
    <g transform="translate(160 685)"><circle cx="55" cy="55" r="45" fill="#e3a044"/><text x="55" y="67" text-anchor="middle" font-size="34" font-weight="700" fill="white">D</text><text x="135" y="51" font-size="34" font-weight="700" fill="#17324d">Established work</text><text x="135" y="91" font-size="28" fill="#536575">Growing skill and responsibility</text></g>
    <g transform="translate(160 855)"><circle cx="55" cy="55" r="45" fill="#dc7c59"/><text x="55" y="67" text-anchor="middle" font-size="34" font-weight="700" fill="white">E</text><text x="135" y="51" font-size="34" font-weight="700" fill="#17324d">Corporate care</text><text x="135" y="91" font-size="28" fill="#536575">Serving people through wider influence</text></g>
    <g transform="translate(160 1025)"><circle cx="55" cy="55" r="45" fill="#d66b58"/><text x="55" y="67" text-anchor="middle" font-size="34" font-weight="700" fill="white">F</text><text x="135" y="51" font-size="34" font-weight="700" fill="#17324d">Mature mission</text><text x="135" y="91" font-size="28" fill="#536575">Fruit, care and sustained impact</text></g>
  </g>
  <text x="500" y="1205" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#a84e3e">WORK-FOCUSED EMPHASIS</text>
  <rect x="90" y="1225" width="820" height="90" rx="18" fill="#17324d"/><text x="500" y="1262" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white">Faithfulness in small responsibilities</text><text x="500" y="1295" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white">prepares us for greater trust.</text>
</svg>
